<header class="site-header">
  <a class="brand" routerLink="/inventory"><b>RT</b><span>Rapid<br />Inventory</span></a>
  @if (auth.user(); as user) {
    <nav aria-label="Primary navigation">
      <a routerLink="/inventory" routerLinkActive="active">Ledger</a>
      <a routerLink="/board" routerLinkActive="active">Live board</a>
    </nav>
    <div class="account">
      <span class="status" [attr.data-state]="realtime.state()"><i></i>{{ realtime.state() }}</span>
      <span class="user" [title]="user.email">{{ user.name }}</span>
      <button type="button" class="sign-out" (click)="signOut()">Sign out</button>
    </div>
  }
</header>
@if (auth.user()) {
  <app-low-stock-alerts />
}
<main><router-outlet /></main>
<footer><span>Warehouse system 03</span><span>UTC synchronized</span></footer>
