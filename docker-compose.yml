services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Inventory!Pass123"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Inventory!Pass123' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: backend
      target: dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=Inventory;User Id=sa;Password=Inventory!Pass123;TrustServerCertificate=True"
      SEED_ORDER_COUNT: "250000"
    ports:
      - "5080:8080"
    volumes:
      - ./backend:/src
      - api-bin:/src/bin
      - api-obj:/src/obj
    depends_on:
      db:
        condition: service_healthy

  web:
    build: frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  sql-data:
  api-bin:
  api-obj:
  web-node-modules:
